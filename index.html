<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Kumenya Mucii — Njeri &amp; Mburu | RSVP</title>
  <meta name="description" content="RSVP for Kumenya Mucii — Njeri & Mburu. Saturday, 26th September 2026 at Nyayo Estate, Embakasi." />

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;0,800;1,400&family=Lato:wght@300;400;700&display=swap" rel="stylesheet" />

  <!-- Firebase (compat SDK for simplicity) -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

  <style>
    :root {
      --brown: #4A1E0A;
      --brown-soft: #6B3316;
      --parchment: #F2E6CC;
      --gold: #A0722A;
      --gold-light: #C89B4E;
      --ivory: #F5EAD0;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    html { scroll-behavior: smooth; }

    body {
      font-family: 'Lato', 'Helvetica Neue', Arial, sans-serif;
      background-color: var(--parchment);
      color: var(--brown);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      /* Subtle parchment texture via layered gradients */
      background-image:
        radial-gradient(ellipse at 20% 10%, rgba(160, 114, 42, 0.08) 0%, transparent 50%),
        radial-gradient(ellipse at 80% 90%, rgba(74, 30, 10, 0.06) 0%, transparent 50%),
        radial-gradient(ellipse at 60% 40%, rgba(200, 155, 78, 0.05) 0%, transparent 60%);
    }

    /* ============ Tribal geometric top & bottom borders ============ */
    .tribal-border {
      width: 100%;
      height: 26px;
      background-color: var(--brown);
      background-image:
        linear-gradient(135deg, var(--gold) 25%, transparent 25%),
        linear-gradient(225deg, var(--gold) 25%, transparent 25%),
        linear-gradient(45deg, var(--gold) 25%, transparent 25%),
        linear-gradient(315deg, var(--gold) 25%, transparent 25%);
      background-position: 13px 0, 13px 0, 0 0, 0 0;
      background-size: 26px 26px;
      background-repeat: repeat-x;
      flex-shrink: 0;
    }
    .tribal-border.bottom { transform: rotate(180deg); }

    .thin-gold-line {
      width: 100%;
      height: 4px;
      background: linear-gradient(90deg, var(--gold), var(--gold-light), var(--gold));
      flex-shrink: 0;
    }

    /* ============ Main card ============ */
    .wrapper {
      width: 100%;
      max-width: 680px;
      padding: 28px 18px 40px;
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .card {
      width: 100%;
      background: var(--ivory);
      border: 2px solid var(--gold);
      border-radius: 14px;
      box-shadow: 0 14px 44px rgba(74, 30, 10, 0.22);
      position: relative;
      overflow: hidden;
      padding: 44px 26px 48px;
      text-align: center;
    }

    /* inner double frame */
    .card::before {
      content: '';
      position: absolute;
      inset: 10px;
      border: 1px solid rgba(160, 114, 42, 0.5);
      border-radius: 9px;
      pointer-events: none;
    }

    /* corner decorations (geometric triangles) */
    .corner {
      position: absolute;
      width: 54px;
      height: 54px;
      pointer-events: none;
      opacity: 0.85;
    }
    .corner.tl { top: 14px; left: 14px; }
    .corner.tr { top: 14px; right: 14px; transform: scaleX(-1); }
    .corner.bl { bottom: 14px; left: 14px; transform: scaleY(-1); }
    .corner.br { bottom: 14px; right: 14px; transform: scale(-1); }

    .kicker {
      font-family: 'Lato', sans-serif;
      font-weight: 700;
      font-size: 0.78rem;
      letter-spacing: 0.34em;
      text-transform: uppercase;
      color: var(--gold);
      margin-bottom: 12px;
    }

    h1 {
      font-family: 'Playfair Display', Georgia, serif;
      font-weight: 800;
      font-size: clamp(2.1rem, 6.5vw, 3.1rem);
      line-height: 1.12;
      color: var(--brown);
      margin-bottom: 6px;
    }

    .names {
      font-family: 'Playfair Display', Georgia, serif;
      font-style: italic;
      font-size: clamp(1.25rem, 4vw, 1.65rem);
      color: var(--gold);
      margin-bottom: 22px;
    }

    .divider {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 14px;
      margin: 18px auto 22px;
    }
    .divider .line {
      width: 74px;
      height: 1px;
      background: linear-gradient(90deg, transparent, var(--gold));
    }
    .divider .line.right {
      background: linear-gradient(90deg, var(--gold), transparent);
    }

    .event-details {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 12px 26px;
      margin-bottom: 8px;
      font-size: 1.02rem;
    }
    .event-details .detail {
      display: flex;
      align-items: center;
      gap: 8px;
      color: var(--brown-soft);
      font-weight: 400;
    }
    .event-details .detail strong { font-weight: 700; color: var(--brown); }
    .event-details svg { flex-shrink: 0; }

    /* ============ Counter ============ */
    .counter-block {
      margin: 34px auto 30px;
      padding: 26px 20px 30px;
      max-width: 420px;
      background: linear-gradient(180deg, rgba(160,114,42,0.10), rgba(160,114,42,0.04));
      border: 1px solid rgba(160, 114, 42, 0.4);
      border-radius: 12px;
      position: relative;
    }
    .counter-block::before,
    .counter-block::after {
      content: '◆';
      position: absolute;
      top: -11px;
      color: var(--gold);
      background: var(--ivory);
      padding: 0 6px;
      font-size: 0.85rem;
    }
    .counter-block::before { left: 22px; }
    .counter-block::after { right: 22px; }

    .counter-number {
      font-family: 'Playfair Display', Georgia, serif;
      font-weight: 800;
      font-size: clamp(3.4rem, 12vw, 5rem);
      line-height: 1;
      color: var(--brown);
      transition: transform 0.25s ease;
    }
    .counter-number.bump { animation: bump 0.5s ease; }
    @keyframes bump {
      0% { transform: scale(1); }
      40% { transform: scale(1.22); color: var(--gold); }
      100% { transform: scale(1); }
    }

    .counter-label {
      margin-top: 8px;
      font-size: 1.02rem;
      letter-spacing: 0.02em;
      color: var(--brown-soft);
    }
    .counter-label strong { color: var(--gold); font-weight: 700; }

    /* ============ RSVP Button ============ */
    .rsvp-btn {
      font-family: 'Lato', sans-serif;
      font-weight: 700;
      font-size: 1.18rem;
      letter-spacing: 0.03em;
      color: var(--ivory);
      background: linear-gradient(180deg, var(--brown-soft), var(--brown));
      border: 2px solid var(--gold);
      border-radius: 60px;
      padding: 18px 46px;
      cursor: pointer;
      box-shadow: 0 8px 22px rgba(74, 30, 10, 0.35), inset 0 1px 0 rgba(245, 234, 208, 0.18);
      transition: transform 0.18s ease, box-shadow 0.18s ease, background 0.25s ease;
      -webkit-tap-highlight-color: transparent;
    }
    .rsvp-btn:hover:not(:disabled) {
      transform: translateY(-3px);
      box-shadow: 0 12px 30px rgba(74, 30, 10, 0.42), inset 0 1px 0 rgba(245, 234, 208, 0.18);
    }
    .rsvp-btn:active:not(:disabled) { transform: translateY(0); }
    .rsvp-btn:disabled {
      cursor: default;
      background: linear-gradient(180deg, #8a7a5c, #6f6248);
      border-color: rgba(160, 114, 42, 0.55);
      box-shadow: none;
      opacity: 0.92;
    }
    .rsvp-btn.confirmed {
      background: linear-gradient(180deg, var(--gold-light), var(--gold));
      color: var(--brown);
      border-color: var(--brown);
      opacity: 1;
    }
    .rsvp-btn.loading { opacity: 0.7; cursor: wait; }

    .thankyou {
      margin-top: 20px;
      font-family: 'Playfair Display', Georgia, serif;
      font-style: italic;
      font-size: 1.15rem;
      color: var(--gold);
      opacity: 0;
      transform: translateY(8px);
      transition: opacity 0.6s ease, transform 0.6s ease;
      min-height: 1.6em;
    }
    .thankyou.show { opacity: 1; transform: translateY(0); }

    .error-msg {
      margin-top: 14px;
      font-size: 0.92rem;
      color: #8b2c0f;
      display: none;
    }
    .error-msg.show { display: block; }

    /* ============ Decorative SVG rows ============ */
    .deco-row {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 18px;
      margin: 26px 0 4px;
      opacity: 0.9;
    }

    footer {
      margin-top: 26px;
      text-align: center;
      font-size: 0.85rem;
      color: var(--brown-soft);
      opacity: 0.8;
      padding: 0 16px;
    }
    footer .heart { color: var(--gold); }

    @media (max-width: 480px) {
      .card { padding: 38px 16px 40px; }
      .corner { width: 40px; height: 40px; }
      .rsvp-btn { width: 100%; max-width: 340px; padding: 17px 20px; }
      .event-details { flex-direction: column; gap: 8px; }
    }
  </style>
</head>
<body>

  <div class="tribal-border" aria-hidden="true"></div>

  <div class="wrapper">
    <div class="card">

        </svg>

          <path d="M8 26 Q15 22 22 26" stroke="#F5EAD0" stroke-width="1.4" fill="none" stroke-linecap="round"/>

          <path d="M12 34 L13.4 32 L14.8 34 L16.2 32 L17.6 34" stroke="#4A1E0A" stroke-width="1.1" fill="none" stroke-linecap="round" stroke-linejoin="round"/>

        <svg width="34" height="24" viewBox="0 0 34 24">

          <path d="M9.5 12 L10.5 14 M12.5 11 L13.5 13.4 M15.5 10.6 L16.5 13 M18.5 10.6 L19.5 13 M21.5 11 L22.5 13.4 M24.5 12 L25 13.8" stroke="#4A1E0A" stroke-width="1.1" stroke-linecap="round"/>

      <div class="divider" aria-hidden="true">
        <span class="line"></span>
        <!-- small cowrie divider mark -->
        <svg width="22" height="15" viewBox="0 0 34 24">
          <ellipse cx="17" cy="12" rx="15" ry="10.5" fill="none" stroke="#A0722A" stroke-width="2"/>
          <path d="M7 12 Q17 8 27 12" stroke="#A0722A" stroke-width="2" fill="none" stroke-linecap="round"/>

        <span class="detail">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#A0722A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
          <span><strong>Saturday, 26th September 2026</strong></span>
        </span>
        <span class="detail">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#A0722A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg>

      <div class="counter-block">
        <div class="counter-number" id="counter" aria-live="polite">—</div>

      </div>

      <button class="rsvp-btn" id="rsvpBtn" disabled>Loading…</button>
      <p class="thankyou" id="thankyou"></p>
      <p class="error-msg" id="errorMsg"></p>

      <!-- bottom decorative row -->
      <div class="deco-row" aria-hidden="true">
        <svg width="120" height="14" viewBox="0 0 120 14">
          <path d="M0 7 L10 1 L20 7 L30 1 L40 7 L50 1 L60 7 L70 1 L80 7 L90 1 L100 7 L110 1 L120 7" stroke="#A0722A" stroke-width="1.6" fill="none"/>
          <path d="M0 7 L10 13 L20 7 L30 13 L40 7 L50 13 L60 7 L70 13 L80 7 L90 13 L100 7 L110 13 L120 7" stroke="#4A1E0A" stroke-width="1.2" fill="none" opacity="0.55"/>

  <div class="thin-gold-line" aria-hidden="true"></div>
  <div class="tribal-border bottom" aria-hidden="true"></div>

  <script>
    /* ================================================================
     * FIREBASE CONFIGURATION
     * ----------------------------------------------------------------
     * Replace the placeholder values below with your own Firebase
     * project's web app config. Find it in:
     * Firebase Console → Project Settings → General → Your apps → Web app
     *
     * NOTE: These values are safe to expose in frontend code — they are
     * identifiers, not secrets. Security is enforced by Firebase rules.
     * ================================================================ */
    const firebaseConfig = {
      apiKey: "AIzaSyDf3B51_Fzcc6tt_XXBTuZ5iV39AojJ8OE",
      authDomain: "kumenya-mucii-rsvp.firebaseapp.com",
      databaseURL: "https://kumenya-mucii-rsvp-default-rtdb.firebaseio.com",
      projectId: "kumenya-mucii-rsvp",
      storageBucket: "kumenya-mucii-rsvp.firebasestorage.app",
      messagingSenderId: "255256740324",
      appId: "1:255256740324:web:20a36061c516772b3787f1"
    };

    const LS_KEY = 'kumenya_mucii_rsvp_confirmed';

    const counterEl = document.getElementById('counter');
    const btn = document.getElementById('rsvpBtn');
    const thankyouEl = document.getElementById('thankyou');
    const errorEl = document.getElementById('errorMsg');

    let db = null;
    let alreadyConfirmed = false;
    let submitting = false;

    /* ---------- Simple djb2 hash for device fingerprinting ---------- */
    function djb2Hash(str) {
      let hash = 5381;
      for (let i = 0; i < str.length; i++) {
        hash = ((hash << 5) + hash + str.charCodeAt(i)) | 0; // hash * 33 + c
      }
      // Convert to unsigned and base36 for a compact, key-safe string
      return 'fp_' + (hash >>> 0).toString(36);
    }

    function getDeviceFingerprint() {
      const raw = [
        navigator.userAgent,
        screen.width,
        screen.height,
        navigator.language,
        navigator.platform
      ].join('|');
      return djb2Hash(raw);
    }

    function showError(msg) {
      errorEl.textContent = msg;
      errorEl.classList.add('show');
    }
    function clearError() {
      errorEl.textContent = '';
      errorEl.classList.remove('show');
    }

    function setConfirmedUI(isReturning) {
      btn.disabled = true;
      btn.classList.add('confirmed');
      if (isReturning) {
        btn.textContent = "You've already confirmed attendance ✅";
      } else {
        btn.textContent = '✅ You\'re Confirmed!';
        thankyouEl.textContent = "Asante! We can't wait to celebrate with you 🎉";
        thankyouEl.classList.add('show');
      }
    }

    function setReadyUI() {
      btn.disabled = false;
      btn.textContent = '🎉 I Will Attend';
    }

    function bumpCounter(value) {
      counterEl.textContent = value;
      counterEl.classList.remove('bump');
      // force reflow so the animation can replay
      void counterEl.offsetWidth;
      counterEl.classList.add('bump');
    }

    /* ---------- Notify backend (Netlify Function) ---------- */
    async function callNotify(newCount) {
      try {
        await fetch('/.netlify/functions/notify', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ counter: newCount })
        });
      } catch (err) {
        // Notification failure should never break the RSVP experience
        console.warn('notify function call failed:', err);
      }
    }

    /* ---------- RSVP click handler ---------- */
    async function handleRsvp() {
      if (alreadyConfirmed || submitting || !db) return;
      submitting = true;
      clearError();
      btn.classList.add('loading');
      btn.textContent = 'Confirming…';
      btn.disabled = true;

      const fingerprint = getDeviceFingerprint();

      try {
        // 1. Record fingerprint
        await db.ref('fingerprints/' + fingerprint).set({
          confirmedAt: firebase.database.ServerValue.TIMESTAMP
        });

        // 2. Atomically increment the counter
        const result = await db.ref('counter').transaction(function (current) {
          return (current || 0) + 1;
        });

        const newCount = result.snapshot.val();

        // 3. Persist local flag
        try { localStorage.setItem(LS_KEY, '1'); } catch (e) { /* private mode */ }

        alreadyConfirmed = true;
        btn.classList.remove('loading');
        setConfirmedUI(false);

        // 4. Fire the notify function (non-blocking for UX)
        callNotify(newCount);
      } catch (err) {
        console.error('RSVP failed:', err);
        submitting = false;
        btn.classList.remove('loading');
        setReadyUI();
        showError('Oops — something went wrong. Please check your connection and try again.');
      }
    }

    /* ---------- Initialise ---------- */
    function init() {
      // Guard: config not yet filled in
      if (firebaseConfig.apiKey === 'FIREBASE_API_KEY') {
        counterEl.textContent = '0';
        btn.textContent = '🎉 I Will Attend';
        btn.disabled = true;
        showError('Setup needed: replace the Firebase placeholder config in index.html.');
        return;
      }

      try {
        firebase.initializeApp(firebaseConfig);
        db = firebase.database();
      } catch (err) {
        console.error('Firebase init failed:', err);
        showError('Could not connect to the RSVP service. Please try again later.');
        return;
      }

      // Live counter — updates in real-time for everyone
      db.ref('counter').on('value', function (snap) {
        const val = snap.val() || 0;
        bumpCounter(val);
      }, function (err) {
        console.error('counter listener error:', err);
        showError('Could not load the live counter.');
      });

      // Fast check: localStorage flag
      let localFlag = false;
      try { localFlag = localStorage.getItem(LS_KEY) === '1'; } catch (e) { /* ignore */ }

      if (localFlag) {
        alreadyConfirmed = true;
        setConfirmedUI(true);
        return;
      }

      // Thorough check: fingerprint already recorded in Firebase?
      const fingerprint = getDeviceFingerprint();
      db.ref('fingerprints/' + fingerprint).once('value')
        .then(function (snap) {
          if (snap.exists()) {
            alreadyConfirmed = true;
            try { localStorage.setItem(LS_KEY, '1'); } catch (e) { /* ignore */ }
            setConfirmedUI(true);
          } else {
            setReadyUI();
          }
        })
        .catch(function (err) {
          console.error('fingerprint check failed:', err);
          // Fail open — let the user try to RSVP anyway
          setReadyUI();
        });
    }

    btn.addEventListener('click', handleRsvp);
    init();
  </script>
</body>
